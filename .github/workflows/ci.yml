name: CI

# Builds the full deck and runs the WebKit and Chromium render checks on
# every push to master and every PR, so a broken map-data pipeline or card
# template is caught immediately instead of only at release time (see
# release.yml, which only runs on tag push / manual dispatch).
on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Playwright's own image for this exact pinned version: Chromium and
    # WebKit plus every OS-level shared library they need are already
    # installed, so `npm ci`'s postinstall (playwright install chromium
    # webkit) finds them in place instead of downloading, and there's no
    # separate install-deps/apt step needed at all.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4

      # Unlike the full ubuntu-latest runner (see release.yml), Playwright's
      # image is a minimal browser-testing image and doesn't ship make/zip.
      - run: apt-get update && apt-get install -y --no-install-recommends make zip unzip

      # Keyed on the pinned-checksums manifest, not on nothing: a hit skips
      # every curl (the slow part of `make`) and Make's recipes see the
      # files already present as up to date, so verify_checksum.js doesn't
      # even run this time either. That's fine — a cached file only got
      # cached after passing verification once, so it's still exactly what
      # was pinned. The cache key only changes (a miss, forcing a fresh
      # fetch + verify against the new pin) when someone deliberately runs
      # `make pin-data` and commits the result. This does NOT re-poll live
      # upstream sources for drift on a cache hit; that's a separate concern
      # from keeping every push fast.
      - uses: actions/cache@v4
        with:
          path: build/maps/raw
          key: raw-map-data-${{ hashFiles('src/data/raw_source_checksums.json') }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Caches the installed/linked node_modules itself (setup-node's own
      # cache above only covers npm's download cache, not the install), so
      # an unchanged lockfile restores directly instead of npm ci
      # reinstalling ~240 packages from scratch every push.
      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --omit=dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pipenv"

      - run: pip install pipenv

      - run: pipenv install --deploy

      - run: make

      - run: make webkit-check

      - run: make chromium-check
