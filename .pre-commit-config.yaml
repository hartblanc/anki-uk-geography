repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-merge-conflict
    - id: check-yaml
    - id: check-added-large-files
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format
-   repo: https://github.com/pre-commit/mirrors-mypy
    # Pinned to the last release still supporting Python 3.9 (this repo's
    # target version, per Pipfile) - mypy 2.x requires 3.10+.
    rev: v1.19.1
    hooks:
    - id: mypy
      args: [--disallow-incomplete-defs, --disallow-untyped-defs, --ignore-missing-imports]
-   repo: local
    hooks:
    # Run via the repo's own npm-installed binaries (language: system) rather
    # than pre-commit's mirrors, which lag the real tools' releases. Requires
    # `npm install` to have been run (see CONTRIBUTING.md).
    - id: prettier
      name: prettier
      entry: node_modules/.bin/prettier --write
      language: system
      types_or: [javascript, css, json]
      exclude: ^package-lock\.json$
    - id: prettier-mustache
      # Separate hook: `types_or` above matches by content-sniffed file
      # type, which never includes html, and card templates need the
      # mustache parser (see prettier.config.js) rather than plain html.
      name: prettier (Anki card templates)
      entry: node_modules/.bin/prettier --write
      language: system
      files: ^utils/uk_geog/templates/.*\.html$
    - id: eslint
      name: eslint
      entry: node_modules/.bin/eslint
      language: system
      types: [javascript]
