<script src="_maps.js"></script>
<style>
  [id="cities"] > :not([id="{{City}}"]) {
    visibility: hidden;
  }
  [id="ring_cities"] > :not(circle[data-city="{{City}}"]) {
    visibility: hidden;
  }
  [id="cities"] > [id="{{City}}"] {
    fill: #d00;
  }
</style>

<div id="fitcontent">
  <header>
    <div class="type">City?</div>
    <div id="city-answer" class="center">{{City}}</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">
    <div class="map-slot" id="cities-map"></div>
  </div>

  <!-- A bit of a hack because you can't tell the difference between these two pairs by just looking a the map. -->
  <!-- The unfortunate side-effect is that you'll get asked to identify them twice as often. -->
  <!-- will sort this out at some point when the zoombox is a little better -->
</div>
<script>
  (function () {
    function whenReady(fn) {
      if (typeof injectMap === "function") {
        fn();
      } else {
        setTimeout(function () {
          whenReady(fn);
        }, 10);
      }
    }
    whenReady(function () {
      injectMap("cities-map", "cities");

      var cityAnswer = document.getElementById("city-answer");
      if (cityAnswer) {
        if (cityAnswer.textContent == "City of London") {
          cityAnswer.textContent = "City of London + City of Westminster";
        }
        if (cityAnswer.textContent == "City of Westminster") {
          cityAnswer.textContent = "City of London + City of Westminster";
        }
        if (cityAnswer.textContent == "Manchester") {
          cityAnswer.textContent = "Manchester + Salford";
        }
        if (cityAnswer.textContent == "Salford") {
          cityAnswer.textContent = "Manchester + Salford";
        }
      }
    });
  })();
</script>
