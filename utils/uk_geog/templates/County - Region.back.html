<style>
  [id="{{MacroLocation}}"] {
    fill: #d00;
    fill-opacity: 0.5;
  }

  #svg-counties {
    display: none;
  }
</style>

<script src="maps.js"></script>
<div id="svg-counties"></div>
<script>injectMap("svg-counties", "counties");</script>

<div id="fitcontent">
  <header>
    <div class="type">County</div>
    <div class="value value--top">{{County}}</div>

    <hr />

    <div class="type">Region?</div>
    <div class="center">{{MacroLocation}}</div>
  </header>
  <div class="center">
    <div class="map-slot" id="regions-map"></div>
    <script>injectMap("regions-map", "regions");</script>
    <script>
      (function () {
        var countyId = "{{County}}";
        var countyEl = document.getElementById(countyId);
        var regionsSvg = document.getElementById("regions_map");

        if (countyEl && regionsSvg) {
          // Clone and append the county, highlighting it red so that we can see it.
          var clonedCounty = countyEl.cloneNode(true);
          // change the ID to avoid any conflicts between counties and regions
          clonedCounty.id = "selected-county";
          clonedCounty.style.fill = "#d00";
          regionsSvg.appendChild(clonedCounty);
        }
      })();
    </script>
    <script>
    @[utils/uk_geog/snippets/zoombox.js]
    </script>
    <svg id="zoombox" viewBox="0 0 800 1159"></svg>
    <script>
      setupZoombox({
        mapId: "regions_map",
        targetId: "selected-county",
        current: "{{County}}",
        zoomNames: ["City of London"],
      });
    </script>
  </div>
</div>
