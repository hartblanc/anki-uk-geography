<style>
  [id="county-{{County}}"] {
    fill: #d00;
  }
</style>
<div id="fitcontent">
  <header>
    <div class="type">County</div>
    <div class="value value--top">{{County}}</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">
    <img src="build/maps/counties.min.svg">
    <svg id="zoombox" viewBox="0 0 800 1159"></svg>
    <script src="utils/uk_geog/snippets/zoombox.js"></script>
    <script>
      setupZoombox({
        mapId: "map",
        targetId: "county-{{County}}",
      });
    </script>
  </div>
</div>
