{{#County}}
<style>
  [id="county-{{County}}"] {
    fill: #d00;
  }
</style>

<div id="fitcontent">
  <header>
    <div class="type">County?</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">
    @[build/maps/counties.min.svg]
    <svg id="zoombox" viewBox="0 0 800 1159"></svg>
    <script>
      @[utils/uk_geog/snippets/zoombox.js]
      setupZoombox({
        mapId: "map",
        targetId: "county-{{County}}",
        current: "{{County}}",
        zoomNames: ["City of London"],
      });
    </script>
  </div>
</div>
{{/County}}
