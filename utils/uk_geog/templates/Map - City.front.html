{{#City}}
<style>
  .city:not([id="city-{{City}}"]) {
    visibility: hidden;
  }
  [id="city-{{City}}"] .city-marker {
    fill: #d00;
  }
</style>

<div id="fitcontent">
  <header>
    <div class="type">City?</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">
    @[build/maps/cities.min.svg]
  </div>
</div>
{{/City}}
