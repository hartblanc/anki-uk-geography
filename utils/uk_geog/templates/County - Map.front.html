{{#County}}

  <header>
    <div class="type">County</div>
    <div class="value value--top">{{County}}</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">
    <div class="map-slot" id="counties-map"></div>
    <script src="maps.js"></script>
    <script>injectMap("counties-map", "counties");</script>
  </div>
</div>
{{/County}}
