{{#Region}}
<style>
  [id="{{Region}}"] {
    fill: #d00;
  }
</style>

<div id="fitcontent">
  <header>
    <div class="type">Region?</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">
    <div class="map-slot" id="regions-map"></div>
    <script src="maps.js"></script>
    <script>injectMap("regions-map", "regions");</script>
  </div>
</div>
{{/Region}}
