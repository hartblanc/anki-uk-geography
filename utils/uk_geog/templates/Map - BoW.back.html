<style>
  [id="water"] {
    stroke: none;
  }
  [id="{{BoW}}"] {
    fill: #07b;
  }
</style>

<div id="fitcontent">
  <header>
    <div class="type">Body of Water?</div>
    <div class="center">{{BoW}}</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">
    <div class="map-slot" id="bow-map"></div>
    <script src="maps.js"></script>
    <script>injectMap("bow-map", "bodies_of_water");</script>
    <script src="move_to_front.js"></script>
    <script>
    moveToFront("{{BoW}}");
    </script>
  </div>
</div>
