{{#City}}
  <style>
    [id='Cities'] > :not([id='{{MacroLocation}}']),
    [id='Cities'] [id='{{MacroLocation}}'] > :not([id='{{City}}']),
    [id='Bodies of Water'] {
      visibility: hidden;
    }
  </style>

  <header>
    <div class="type">City?</div>
    <div class="center">{{type:City}}</div>

    <hr>

    <div class="type">Location on the map</div>

  </header>
  <div class="center">
    @[build/maps/cities.min.svg]
  </div>
  @[utils/uk_geog/snippets/highlight_multiple_counties.html]
{{/City}}
