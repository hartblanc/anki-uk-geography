<style>
  [id="{{County}}"] {
    fill: #d00;
  }
  #city_of_london > :not(circle[id="{{County}}"]) {
    visibility: hidden;
  }
  #ring_city:not([data-city="{{County}}"]) {
    visibility: hidden;
  }
</style>

<div id="fitcontent">
  <header>
    <div class="type">County?</div>
    <div class="center">{{County}}</div>

    <hr />

    <div class="type">Location on the map</div>
  </header>
  <div class="center">@[build/maps/counties.min.svg]</div>
</div>
