<svg id="zoombox" viewBox="220 295 130 52">
    <use href="#svg-counties" width="500" height="700">
</svg>
<script>
    centralBeltCounties = [
        "East Lothian", "Midlothian", "Edinburgh", "West Lothian",
        "Falkirk", "North Lanarkshire", "East Dunbartonshire",
        "West Dunbartonshire", "Glasgow", "East Renfrewshire",
        "Renfrewshire", "Inverclyde", "Clackmannanshire", "North Ayrshire"
    ]
    document.getElementById("zoomfocus").style.visibility = "hidden"
    if (centralBeltCounties.includes("{{County}}")){
        document.getElementById("zoombox").style.visibility = "visible"
        document.getElementById("zoomfocus").style.visibility = "visible"
    }
</script>
