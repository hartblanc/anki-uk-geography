<svg id="zoombox" viewBox="0 0 800 1159">
  <use href="#map" xlink:href="#map" width="800" height="1159"/>
</svg>
<script>
  (function () {
    var zoomCounties = ["City of London"];
    var currentCounty = "{{County}}";
    if (zoomCounties.indexOf(currentCounty) !== -1) {
      var targetEl = document.getElementById(currentCounty);
      var zoombox = document.getElementById("zoombox");
      var mapSvg = document.getElementById("map");
      if (targetEl && zoombox && mapSvg) {
        zoombox.style.display = "block";
        var bbox = targetEl.getBBox();
        var centerX = bbox.x + bbox.width / 2;
        var centerY = bbox.y + bbox.height / 2;
        var zsize = 40;
        zoombox.setAttribute(
          "viewBox",
          (centerX - zsize / 2) +
            " " +
            (centerY - zsize / 2) +
            " " +
            zsize +
            " " +
            zsize
        );

        var rect = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "rect"
        );
        rect.setAttribute("class", "zoom-indicator");
        rect.setAttribute("x", centerX - zsize / 2);
        rect.setAttribute("y", centerY - zsize / 2);
        rect.setAttribute("width", zsize);
        rect.setAttribute("height", zsize);
        mapSvg.appendChild(rect);
      }
    }
  })();
</script>
