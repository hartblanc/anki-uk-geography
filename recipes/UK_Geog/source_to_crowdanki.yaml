
- generate_guids_in_csv:
    source: build/uk_geog.csv
    columns: [ guid ]

- build_parts:
  - note_model_from_yaml_part:
      part_id: UK Geog
      file: src/note_models/UK_Geog/note_models.yaml

  - headers_from_yaml_part:
      part_id: default header
      file: src/headers/UK_Geog/default.yaml
      override:
        deck_description_html_file: src/headers/UK_Geog/desc.html
        crowdanki_uuid: 9767622e-998e-11f1-a0e6-ae68d1863a7f

  - notes_from_csvs:
      part_id: uk_geog

      note_model_mappings:
        - note_models:
            - UK Geog
          columns_to_fields:
            guid: guid
            tags: tags

            Location: Location
            MacroLocation: MacroLocation
            City: City
            County: County
            Region: Region
            BoW: BoW
            motorway: Motorway

          personal_fields: [ ]

      file_mappings:
        - file: build/uk_geog.csv
          note_model: UK Geog

  - media_group_from_folder:
      part_id: deck media
      source: build/media


- generate_crowd_anki:
    headers: default header

    note_models:
      parts:
        - part_id: UK Geog

    folder: build/United Kingdom Geography - Regions Counties and Cities

    notes:
      part_id: uk_geog
      sort_order: [guid]

    media:
      parts:
        - deck media
